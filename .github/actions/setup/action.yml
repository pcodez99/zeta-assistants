name: Setup Node & Dependencies
description: Install the project Node and pnpm versions and locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Enable pnpm
      shell: bash
      run: corepack enable && corepack prepare pnpm@9.0.0 --activate
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
